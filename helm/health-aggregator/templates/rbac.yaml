apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "health-aggregator.fullname" . }}-role
  labels:
    {{- include "health-aggregator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "health-aggregator.fullname" . }}-rb
  labels:
    {{- include "health-aggregator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "health-aggregator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "health-aggregator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
