apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "health-aggregator.fullname" . }}-deploy
  labels:
    {{- include "health-aggregator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "health-aggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.prometheus.path | quote }}
        prometheus.io/port: {{ .Values.prometheus.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "health-aggregator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "health-aggregator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.config.monitorNamespace }}
            - name: NAMESPACE
              value: {{ .Values.config.monitorNamespace | quote }}
            {{- else }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: CONFIG_PATH
              value: "/etc/health-aggregator/config.yaml"
            {{- if .Values.config.serviceAccountName }}
            - name: SERVICE_ACCOUNT_NAME
              value: {{ .Values.config.serviceAccountName | quote }}
            {{- end }}
            - name: PULL_INTERVAL
              value: {{ .Values.config.pullInterval | default "10s" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | default "info" | quote }}
          ports:
            - name: main
              containerPort: {{ .Values.config.server.main.port | default 8080 }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.config.server.health.port | default 8081 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
          readinessProbe:
            httpGet:
              path: /health
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/health-aggregator
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "health-aggregator.fullname" . }}-cm
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
