# Default values for health-aggregator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: repo.ghaba.dev/infra/health-aggregator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: "" # overwrite default name: health-aggregator

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Configuration for the health-aggregator
config:
  # The namespace to monitor. If not set, it defaults to the namespace where the aggregator is deployed.
  # monitorNamespace: ""
  # Service account name to impersonate (optional)
  # serviceAccountName: ""
  # YAML configuration for resources and server
  # See README.md for format
  pullInterval: "10s"
  logLevel: "info"
  server:
    main:
      port: 8080
    health:
      port: 8081
    metrics:
      enabled: true
      path: "/metrics"
  resources:
    pods: []
    deployments: # [ ]
      - name: jenkins
        replicas: 1
        max: 2
    replicaSets: []
    jobs: []

service:
  type: ClusterIP
  mainPort: 8080
  healthPort: 8081

# Prometheus scraping configuration
prometheus:
  enabled: true
  path: /metrics
  port: health

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: health-aggregator.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: health-aggregator-tls
  #    hosts:
  #      - health-aggregator.local
